<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel dos Noivos</title>
  <style>
    :root { --olive:#661C1D; --magenta:#8C3D3E; --bg:#FDFAF7; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color:#2E1B1B; margin:0; padding:16px; }
    h1 { color: var(--olive); margin: 0 0 4px; }
    .card { background:#fff; border-radius:12px; padding:16px; margin:16px 0; box-shadow:0 4px 12px rgba(0,0,0,.06); }
    input { padding:10px; border:1px solid #ccc; border-radius:8px; width:260px; max-width:100%; }
    button { padding:8px 14px; border:none; border-radius:8px; cursor:pointer; font-weight:600; color:#fff; background:var(--olive); }
    button.no { background: var(--magenta); }
    table { width:100%; border-collapse: collapse; font-size:.9rem; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid #eee; vertical-align: top; }
    .PENDING { color:#8C3D3E; font-weight:700; } .PAID { color:#5E6B3A; font-weight:700; } .REJECTED { color:#999; }
    .stats { display:flex; gap:12px; flex-wrap:wrap; } .stats div { background:var(--olive); color:#fff; padding:10px 16px; border-radius:8px; }
    .wrap { overflow-x:auto; }
  </style>
</head>
<body>
  <img src="assets/identidade/monograma_small.png" alt="" style="width:60px"><h1>Painel dos Noivos</h1>
  <p>Confira no extrato do banco e confirme os presentes que realmente caíram na conta.</p>

  <div class="card">
    <label for="token">Senha do painel (ADMIN_TOKEN):</label><br>
    <input type="password" id="token" autocomplete="current-password">
    <button id="btnLoad">Entrar</button>
    <p id="msg" style="color:#9E2B54"></p>
  </div>

  <div id="content" hidden>
    <div class="stats card" id="stats"></div>
    <div class="card">
      <a href="livro.html" target="_blank" rel="noopener"><button type="button">📖 Livro de recados (PDF)</button></a>
      <small style="margin-left:8px">Abre todas as mensagens formatadas. Use "Salvar como PDF".</small>
    </div>
    <div class="card wrap">
      <h2>Presentes informados</h2>
      <table><thead><tr><th>#</th><th>Data</th><th>Convidado</th><th>Presente</th><th>Valor</th><th>Pagamento</th><th>Mensagem</th><th>Status</th><th></th></tr></thead>
      <tbody id="contribs"></tbody></table>
    </div>
    <div class="card wrap">
      <h2>Confirmações de presença</h2>
      <table><thead><tr><th>Convidado</th><th>Convite</th><th>Status</th><th>Atualizado</th></tr></thead><tbody id="rsvps"></tbody></table>
    </div>
  </div>

<script src="api-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
